    <h1>What is Node.js — iLoveLearnDocs</h1>

    <p>
      Node.js is an environment that allows you to run JavaScript not only
      in a browser, but also on a computer or server. Previously, JavaScript could
      only run within a web page, but with Node.js, it has become a standard language
      for programs.
    </p>

    <!-- InfoBlock: brief explanation -->
    <div data-block="info" data-text="Node.js doesn't replace the browser; it extends JavaScript to the server. It's the same language—but with different capabilities."></div>

    <p>
      Simply put, Node.js enables JavaScript to do things that
      previously only other languages could do: read files, work with the network,
      run servers, and interact with databases.
    </p>

    <h2>Why Do We Need Node.js</h2>

    <p>
      With Node.js, you can write the server-side code for a website in the same language
      as the client-side code. You don't need to learn a second language just for the server.
      This is convenient and saves time.
    </p>

    <p>
      In addition to websites, Node.js is used to write development tools, scripts
      for automation, and even small computer programs.
    </p>

    <h2>How It Works</h2>

    <p>
      Node.js is built on the V8 engine — the same one used in the Chrome browser.
      It converts JavaScript into commands that a computer can understand.
      Node.js takes this engine and adds the ability to work
      with files, the network, and the operating system.
    </p>

    <!-- DetailInfoBlock: detailed explanation with a heading -->
    <div
      data-block="detail"
      data-title="What is a V8 engine"
      data-text="V8 is a program that reads JavaScript and converts it into instructions for the processor. It runs directly while the code is executing — which is why Node.js programs start up quickly."
    ></div>

    <p>
      The main feature of Node.js is that it doesn't wait for one task to finish
      before starting another. While one request is being processed, Node.js is already
      accepting the next one. That's why it handles a large number of
      concurrent connections so well.
    </p>

    <h2>A simple example</h2>

    <p>
      Here's what a small Node.js server looks like. It responds to requests
      with plain text.
    </p>
    
  <!-- CodeBlock: a code block with syntax highlighting and a copy button -->  
    <div
      data-block="code"
      data-language="js"
      data-code="const http = require('http');

const server = http.createServer((req, res) => {
  res.end('Hello from Node.js');
});

server.listen(3000, () => {
  console.log('The server is running on port 3000');
});"
    ></div>

    <p>
      This code creates a server that listens on port 3000 and responds to each request
      with a message. To run it, you need Node.js installed
      and a file containing this code.
    </p>

    <h2>What You Need to Know Before You Start</h2>

    <p>
      To work with Node.js, all you need is a basic understanding of JavaScript: variables,
      functions, objects, and arrays. You can learn the rest as you go.
    </p>

    <p>
      You'll also need to install Node.js on your computer. After installation,
      the node and npm commands will be available on your system — you'll need them to run programs
      and install libraries.
    </p>
